name: Dependency Review

# Scans dependency manifest changes on every PR and fails when a newly
# introduced dependency carries a known high-severity (or worse) advisory.

# Only runs when a manifest, lockfile or workflow changes: with nothing to
# diff the action has no work to do, but it still costs a runner per PR push.
# Safe to filter because this is not a required status check.
on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/pyproject.toml'
      - '**/requirements*.txt'
      - '**/uv.lock'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
