name: Label Check

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: label-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-labels:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify type + priority labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const TYPE_LABELS = ['bug', 'enhancement', 'documentation', 'ci', 'dependencies', 'incident'];
            const hasType = labels.some(l => TYPE_LABELS.includes(l));
            const hasPriority = labels.some(l => l.startsWith('priority:'));

            const missing = [];
            if (!hasType) missing.push(`a type label (one of: ${TYPE_LABELS.join(', ')})`);
            if (!hasPriority) missing.push('a priority label (priority:high, priority:medium, or priority:low)');

            if (missing.length > 0) {
              core.setFailed(`This PR is missing ${missing.join(' and ')}. Add the missing label(s) to pass this check.`);
            }
