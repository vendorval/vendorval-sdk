name: Release (Node)

on:
  push:
    tags:
      - "node-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (latest, next, beta…)"
        required: false
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Node 24 ships with npm >= 11, which is required for Trusted Publishing
      # OIDC token exchange. Avoids the npm self-upgrade race that bites Node 22.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter vendorval-sdk typecheck
      - run: pnpm --filter vendorval-sdk test
      - run: pnpm --filter vendorval-sdk build

      - name: Resolve dist-tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${INPUT_TAG}" =~ ^[a-z][a-z0-9._-]*$ ]]; then
              echo "::error::dist-tag must match ^[a-z][a-z0-9._-]*$"
              exit 1
            fi
            echo "value=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == *"-rc."* || "${GITHUB_REF_NAME}" == *"-beta."* ]]; then
            echo "value=next" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      # We use `npm publish` directly instead of `pnpm publish` because the
      # npm CLI is what implements the OIDC token exchange for Trusted
      # Publishing. pnpm built the artifacts (dist/) above; npm just ships them.
      #
      # The first release of vendorval-sdk (v0.2.0) was bootstrapped from a
      # local machine because npm Trusted Publishing requires the package to
      # already exist on the registry. From v0.2.1 onward, the Trusted
      # Publisher configured at https://www.npmjs.com/package/vendorval-sdk/access
      # supplies the publish credential via OIDC — no NPM_TOKEN needed.
      - name: Publish to npm (OIDC)
        working-directory: packages/node
        env:
          DIST_TAG: ${{ steps.tag.outputs.value }}
        run: |
          echo "Publishing with dist-tag: ${DIST_TAG}"
          npm publish \
            --access public \
            --provenance \
            --tag "${DIST_TAG}"
