name: Secret Scan (gitleaks)

# gitleaks catches custom secret shapes (e.g. `vv_live_*` API keys and
# DATABASE_URL connection strings) that GitHub's native push-protection
# detectors miss. Runs on every pull request and every push to main.

# Push is limited to main: a PR branch is already scanned by the
# pull_request event, and scanning its pushes too ran every scan twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the whole commit range.
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 is NOT usable here: it demands a paid
      # GITLEAKS_LICENSE for any repository owned by an organization ("[vendorval]
      # is an organization. License key is required."), regardless of whether the
      # repo is public. The gitleaks CLI itself stays free and open source, so we
      # run the released binary directly — pinned to a version and verified by
      # checksum, which is also a stronger supply-chain posture than a floating
      # third-party action.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      # Scans the full commit history (fetch-depth: 0 above), so a secret that
      # was committed and then "removed" in a later commit still fails the gate.
      # --redact keeps the matched value out of the public build log; findings
      # are identified by rule, file and line instead.
      - name: Scan for secrets
        run: gitleaks git --no-banner --redact --verbose --exit-code 1 .
