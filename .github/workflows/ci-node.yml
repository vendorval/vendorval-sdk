name: CI (Node)

on:
  push:
    branches: [main]
    paths:
      - "packages/node/**"
      - "specs/**"
      - ".github/workflows/ci-node.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  pull_request:

# Cancel superseded in-progress runs on the same PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter vendorval-sdk typecheck
      # Lint output doesn't depend on the Node version, so run it once.
      - if: matrix.node-version == '24'
        run: pnpm --filter vendorval-sdk lint
      - run: pnpm --filter vendorval-sdk test
      - run: pnpm --filter vendorval-sdk build
