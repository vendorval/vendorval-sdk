name: Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily — catch newly-disclosed CVEs in deps even with no open PR.
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  node-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Informational gate (not a required check): surfaces HIGH+ advisories in
      # production dependencies. Reads pnpm-lock.yaml — no install needed.
      - name: Audit (production deps, HIGH+ only)
        run: pnpm audit --prod --audit-level high

  python-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Audits the resolved dependency environment via pip-audit (OSV advisories).
      - name: Audit (pip-audit)
        run: |
          uv sync
          uv run --with pip-audit pip-audit

  notify:
    name: Notify on state change
    needs: [node-audit, python-audit]
    # Keeps one `ci-failure` issue open while the scheduled run is red and
    # closes it on the next green run, instead of a failure email per run.
    # Scheduled and manual runs on main only: a failed PR or push run already
    # shows on the PR or commit. always() so a failed job still reaches this.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the local composite action
      actions: read # read the failed job's step results
      checks: read # read job annotations (billing block, timeout)
      issues: write # open, update or close the ci-failure issue
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/failure-notify
          persist-credentials: false

      - uses: ./.github/actions/failure-notify
        with:
          needs: ${{ toJSON(needs) }}
          title: Scheduled dependency audit failing
