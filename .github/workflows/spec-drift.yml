name: Spec drift

on:
  schedule:
    # Daily at 06:23 UTC. Off the top of the hour, when scheduled runs are
    # most likely to be delayed or dropped.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-drift
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # To dispatch the CI workflows on the sync branch (see the last step).
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The API serves its spec unauthenticated at /v1/openapi.json, so this
      # needs no secret. The script refuses to write anything that isn't an
      # OpenAPI document with paths, so an outage fails the run instead of
      # opening a PR that empties the snapshot.
      - name: Sync openapi.json
        run: node scripts/sync-openapi.mjs

      - name: Open PR if changed
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(specs): sync openapi.json from upstream"
          branch: chore/sync-openapi
          title: "chore(specs): sync openapi.json from upstream"
          body: |
            Automated sync of `specs/openapi.json` from https://api.vendorval.com/v1/openapi.json.

            Review the diff to see if the SDK surface needs updating.
          labels: spec-sync,automated

      # A PR opened or updated with the default GITHUB_TOKEN doesn't trigger
      # pull_request workflows, so the required checks would never report and
      # the PR could never merge. workflow_dispatch is the exception to that
      # rule, and its check runs land on the same head commit the ruleset
      # looks at.
      - name: Run required checks on the sync branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in ci-node.yml ci-python.yml type-parity.yml audit.yml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref chore/sync-openapi
          done
          echo "Dispatched CI for ${{ steps.pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
