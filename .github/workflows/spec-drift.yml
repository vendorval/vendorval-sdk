name: Spec drift

on:
  schedule:
    # Daily at 06:23 UTC. Off the top of the hour, when scheduled runs are
    # most likely to be delayed or dropped.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  token-check:
    name: Check for VENDORVAL_API_READ_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      present: ${{ steps.token.outputs.present }}
    steps:
      - name: Check for VENDORVAL_API_READ_TOKEN
        id: token
        # Never sync without the token: an empty one falls back to
        # unauthenticated requests and 404s on the private repo, which looks
        # identical to "no release exists".
        #
        # A scheduled run with no token skips the sync with a warning instead
        # of failing, so a known-missing secret doesn't turn every day red and
        # bury real failures. A manual run still fails loudly, because whoever
        # dispatched it wants to know.
        env:
          HAS_TOKEN: ${{ secrets.VENDORVAL_API_READ_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          msg="VENDORVAL_API_READ_TOKEN secret is not set (needs a fine-grained PAT with contents:read on vendorval/vendorval-api)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::Skipping spec sync: $msg"
          echo "Skipped: $msg" >> "$GITHUB_STEP_SUMMARY"

  sync:
    needs: token-check
    if: needs.token-check.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sync openapi.json
        env:
          # Fine-grained PAT with contents:read on vendorval/vendorval-api.
          # The default GITHUB_TOKEN is scoped to this repo and cannot see
          # the private vendorval-api repo's releases.
          GITHUB_TOKEN: ${{ secrets.VENDORVAL_API_READ_TOKEN }}
        run: node scripts/sync-openapi.mjs
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(specs): sync openapi.json from upstream"
          branch: chore/sync-openapi
          title: "chore(specs): sync openapi.json from upstream"
          body: |
            Automated sync of `specs/openapi.json` from the latest upstream VendorVal API release.

            Review the diff to see if the SDK surface needs updating.
          labels: spec-sync,automated
