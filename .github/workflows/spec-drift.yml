name: Spec drift

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Require VENDORVAL_API_READ_TOKEN
        # Fail loud if the secret is missing — an empty token would fall
        # back to unauthenticated requests and 404 on the private repo,
        # which looks identical to "no release exists".
        run: |
          if [ -z "${{ secrets.VENDORVAL_API_READ_TOKEN }}" ]; then
            echo "::error::VENDORVAL_API_READ_TOKEN secret is not set (needs a fine-grained PAT with contents:read on vendorval/vendorval-api)"
            exit 1
          fi
      - name: Sync openapi.json
        env:
          # Fine-grained PAT with contents:read on vendorval/vendorval-api.
          # The default GITHUB_TOKEN is scoped to this repo and cannot see
          # the private vendorval-api repo's releases.
          GITHUB_TOKEN: ${{ secrets.VENDORVAL_API_READ_TOKEN }}
        run: node scripts/sync-openapi.mjs
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(specs): sync openapi.json from upstream"
          branch: chore/sync-openapi
          title: "chore(specs): sync openapi.json from upstream"
          body: |
            Automated sync of `specs/openapi.json` from the latest upstream VendorVal API release.

            Review the diff to see if the SDK surface needs updating.
          labels: spec-sync,automated
