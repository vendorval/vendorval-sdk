name: Spec drift

on:
  schedule:
    # Daily at 06:23 UTC. Off the top of the hour, when scheduled runs are
    # most likely to be delayed or dropped.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-drift
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # To approve the sync PR's CI runs (see the last step).
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The API serves its spec unauthenticated at /v1/openapi.json, so this
      # needs no secret. The script refuses to write anything that isn't an
      # OpenAPI document with paths, so an outage fails the run instead of
      # opening a PR that empties the snapshot.
      - name: Sync openapi.json
        run: node scripts/sync-openapi.mjs

      - name: Open PR if changed
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(specs): sync openapi.json from upstream"
          branch: chore/sync-openapi
          title: "chore(specs): sync openapi.json from upstream"
          body: |
            Automated sync of `specs/openapi.json` from https://api.vendorval.com/v1/openapi.json.

            Review the diff to see if the SDK surface needs updating.
          labels: spec-sync,automated

      # CI on a PR opened by github-actions[bot] doesn't start on its own:
      # GitHub creates the pull_request runs but holds them at "approval
      # required", and the required checks stay "Expected" until someone
      # approves. (Dispatching the workflows separately doesn't help; the PR
      # only counts its own pull_request runs.) Approve them here. If this
      # token isn't allowed to, say so on the PR instead of failing quietly.
      - name: Approve CI runs on the sync PR
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          approved=0 failed=0
          # Runs are created asynchronously after the PR event; give them two minutes.
          for _ in $(seq 1 12); do
            sleep 10
            for id in $(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --event pull_request \
                          --json databaseId,conclusion --jq '.[] | select(.conclusion == "action_required") | .databaseId'); do
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null; then
                approved=$((approved + 1))
              else
                failed=$((failed + 1))
              fi
            done
          done
          echo "Approved $approved CI run(s) for #$PR; $failed approval(s) failed." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -gt 0 ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "CI for this sync PR is waiting for approval and the workflow couldn't approve it automatically. A maintainer needs to click **Approve workflows to run** on this PR."
            echo "::warning::Could not approve $failed CI run(s) on #$PR; left a comment asking a maintainer to approve."
          fi
